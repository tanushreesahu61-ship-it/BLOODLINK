<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BloodLink — Give blood, give life</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-nav">
  <div class="wrap nav-row">
    <a class="brand" href="#/" data-route="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2C9 7 4 11.5 4 15.5a8 8 0 0 0 16 0C20 11.5 15 7 12 2Z"/></svg>
      </span>
      BloodLink
    </a>
    <nav class="nav-links">
      <a href="#/donors" data-route="/donors">Donors</a>
      <a href="#/camps" data-route="/camps">Camps</a>
      <a href="#/emergency" data-route="/emergency">Emergency</a>
      <a href="#/dashboard" data-route="/dashboard">Dashboard</a>
    </nav>
    <div class="nav-auth" id="navAuth">
      <button class="btn btn-ghost" id="btnSignIn">Sign in</button>
    </div>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <span>BloodLink — a community donor network</span>
    <span class="pulse-line" aria-hidden="true">
      <svg viewBox="0 0 300 40" preserveAspectRatio="none"><polyline points="0,20 60,20 75,5 90,35 105,20 300,20"/></svg>
    </span>
    <span id="apiStatus" class="api-status">checking API…</span>
  </div>
</footer>

<div id="modalRoot"></div>

<!--
  ↓ CONFIG: where the backend API lives.
  This merged build is served BY the same Express server as the API,
  so a relative path just works — no URL to edit, on localhost or once deployed.
-->
<script>
  window.BLOODLINK_API_BASE = "/api";
</script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
